# Build a Windows Setup.exe that you can download and share with shop PCs.
# Trigger: Actions → "Build Windows installer" → Run workflow
# Or push a version tag: git tag v0.1.0 && git push origin v0.1.0

name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-setup:
    name: NSIS Setup.exe
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install desktop (Tauri CLI) deps
        working-directory: desktop
        run: npm ci

      - name: Build Windows software package
        shell: pwsh
        run: python scripts/buildSoftware.py

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: MM-Electricals-Windows-Setup
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
