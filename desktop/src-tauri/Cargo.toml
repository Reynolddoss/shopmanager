[package]
name = "mm-electricals"
version = "0.1.0"
description = "MM Electricals desktop shell"
authors = ["MM Electricals"]
edition = "2021"

[lib]
name = "mm_electricals_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
