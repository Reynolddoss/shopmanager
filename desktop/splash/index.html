<!doctype html>
<!--
  Shown by the desktop shell while the local shop service starts (database
  checks can take a few seconds after an update). The shell switches the
  window to the real app once the service answers; if startup fails, this
  page shows what happened and where the log file is.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MM Electricals</title>
    <style>
      :root { color-scheme: light dark; font-family: "Segoe UI", system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f3ee; color: #1f2933; }
      @media (prefers-color-scheme: dark) { body { background: #16181d; color: #e6e8eb; } }
      main { text-align: center; max-width: 34rem; padding: 2rem; }
      h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
      p { margin: 0.4rem 0; opacity: 0.8; }
      .spinner { width: 42px; height: 42px; margin: 1.5rem auto; border-radius: 50%; border: 4px solid rgba(127, 127, 127, 0.25); border-top-color: #c2410c; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error { display: none; text-align: left; margin-top: 1.5rem; padding: 1rem 1.2rem; border-radius: 8px; border: 1px solid #dc2626; background: rgba(220, 38, 38, 0.08); }
      .error strong { color: #dc2626; }
      code { word-break: break-all; font-size: 0.85rem; }
      body.failed .spinner, body.failed #status { display: none; }
      body.failed .error { display: block; }
    </style>
  </head>
  <body>
    <main>
      <h1>MM Electricals</h1>
      <div class="spinner" aria-hidden="true"></div>
      <p id="status">Starting the shop… this can take a few seconds after an update.</p>
      <div class="error" role="alert">
        <p><strong>The shop could not start.</strong></p>
        <p id="error-message"></p>
        <p>Close and reopen the app. If it keeps failing, send this log file to support:</p>
        <p><code id="error-log"></code></p>
      </div>
    </main>
    <script>
      // Ask the shell how startup is going; it navigates away by itself on success.
      const invoke = (command) => window.__TAURI_INTERNALS__.invoke(command);

      const showFailure = (status) => {
        document.getElementById("error-message").textContent = status.message;
        document.getElementById("error-log").textContent = status.log_path;
        document.body.classList.add("failed");
      };

      const poll = () =>
        invoke("startup_status")
          .then((status) => (status.failed ? showFailure(status) : setTimeout(poll, 500)))
          .catch(() => setTimeout(poll, 1000));

      if (window.__TAURI_INTERNALS__) poll();
    </script>
  </body>
</html>
